plugins {
    id 'com.android.application'
}

// Firma opcional: si existe ../keystore.properties se usa; si no, el APK de release
// se firma con la clave de depuración (nunca falla la compilación por falta de keystore).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.example.telemetry'
    // API 35 = Android 15. compileSdk 35 y targetSdk 35 (requisito de Play desde agosto de 2025),
    // minSdk 24. El objetivo real de despliegue es Android 11 (API 30) hasta Android 15/16: todo lo
    // que se usa API 31+ está guardado por versión, y lo que falta en versiones viejas lo cubre el
    // motor fusionado de Google o una alternativa del SDK.
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.telemetry'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.7.0'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Los avisos no bloquean la compilación del APK
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Solo dos dependencias, y las dos son opcionales en tiempo de ejecución (se comprueba antes
    // de usarlas, con caída al SDK puro si no están):
    //  · play-services-location: el motor fusionado de Google, que da WAIT_FOR_ACCURATE_LOCATION
    //    también en Android 11 (la API equivalente del framework solo existe desde Android 12).
    //  · work-runtime: WorkManager como segunda vía de persistencia junto a la alarma del watchdog.
    // Todo lo demás sigue siendo SDK puro: org.json, HttpURLConnection, sensores, GNSS, telefonía.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
