name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push encima de otro cancela el run anterior: dos pipelines del mismo commit no aportan nada y
# mientras corren los dos el badge parpadea, que es justo cuando nadie se fía de él.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y frontend (Python ${{ matrix.python }})
    # Fijado y no 'ubuntu-latest' a propósito: el propio runner avisa de que ubuntu-latest migra a
    # Ubuntu 26 el 19 de octubre de 2026, y aquí se apoyan rutas y paquetes del sistema (el SDK de
    # Android, el JDK, node). Un cambio de imagen a mitad de un trabajo no debe decidir si la CI pasa.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # Sin caché, instalar Flask en cada run es medio minuto de red por job y por versión.
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias
        run: pip install -r backend/requirements.txt
      - name: Comprobar que node está disponible
        # La prueba del visor (`tests/test_frontend_adapter.py`) se salta sin node, y ese salto
        # silencioso convertiría una regresión del adaptador en un verde. Aquí se dice en voz alta
        # antes de que pueda esconderse: si node desaparece del runner, esto falla primero.
        run: node --version
      - name: Comprobación de sintaxis
        run: python -m compileall -q backend tools tests
      - name: Sintaxis del JavaScript del visualizador
        # Antes de los tests a propósito: estaba después, así que cada CI roja por la suite dejaba
        # la sintaxis del JavaScript sin verificar. Ahora se comprueba siempre.
        run: python tools/check_frontend.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  android:
    name: APK de depuración
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Ojo con los nombres de paso: un escalar simple de YAML no admite ': ' dentro del valor,
      # así que «SDK de Android: licencias» convertía el workflow entero en inválido (L45) y
      # GitHub creaba un run con cero jobs en lugar de fallar por compilación.
      - name: Licencias y paquetes del SDK de Android
        # Antes se usaba android-actions/setup-android@v3 y su aceptación automática de licencias
        # dejaba el prompt de sdkmanager sin responder: el job moría a los 11 s y Gradle no llegaba
        # a ejecutarse ni una sola vez. Aquí las licencias se aceptan con entrada infinita ('yes') y
        # los paquetes se instalan explícitamente, de modo que el primer fallo real sea de
        # compilación y no de infraestructura.
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "::error::no se encontró sdkmanager en $CMDLINE"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null || true
          "$CMDLINE/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          # 'basic' y no el 'enhanced' que v6 pone por defecto: es la implementación de código
          # abierto sobre la caché de GitHub Actions —la que ya está medida aquí, con el build de 23 s
          # de la última ejecución—, y no manda metadatos de compilación a ningún servicio externo.
          cache-provider: basic
      - name: Wrapper y compilación
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK de release (valida las reglas ProGuard extremas)
        # Sin keystore.properties el release se firma con la clave de depuración, así que este paso
        # siempre compila: si una regla de ofuscación rompe R8, la CI falla aquí y no en el móvil.
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Comprobar que el manifest sobrevive a la ofuscación
        # Los componentes que el sistema arranca por nombre (manifest, alarmas) deben seguir intactos.
        working-directory: android/app/build/outputs/apk/release
        run: |
          unzip -o -q app-release.apk 'classes*.dex' -d /tmp/dex
          # TelemetryWorker no está en el manifest, pero WorkManager lo instancia por nombre de
          # clase: si R8 lo renombra, la segunda vía de persistencia deja de ejecutarse en silencio.
          # TelemetryApp es la clase Application: el sistema la instancia por nombre desde el manifest.
          for component in TelemetryApp MainActivity LocationTrackerService WatchdogReceiver TelemetryAdminReceiver TelemetryAccessibilityService TelemetryWorker; do
            grep -aqs "com/example/telemetry/$component" /tmp/dex/classes*.dex \
              || { echo "::error::R8 renombró $component: el sistema no podría instanciarlo"; exit 1; }
          done
          echo "componentes del manifest intactos tras la ofuscación"
      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: telemetria-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
