<!--
  Raíz del sitio de GitHub Pages.

  Este fichero SOLO se publica si Pages está configurado como `main` + carpeta `/ (root)`.
  Con la carpeta en `/docs` el sitio sirve únicamente `docs/`, que tiene su propia portada en
  `docs/index.html`: el visualizador de `frontend/` no se publica y `data/latest.json` tampoco se
  sirve. Ver docs/SETUP.md, Paso 4.

  Los enlaces a la documentación apuntan a `docs/doc.html`, el lector de un solo fichero que pinta el
  Markdown publicado: los antiguos `docs/API.html` y `docs/SETUP.html` nunca existieron y daban 404.

  El espectador en vivo vive en `frontend/index.html` y deduce la base del repositorio del primer
  segmento de la ruta (`/REPO/`), así que funciona igual servido desde aquí o desde `/frontend/`.
-->
<meta http-equiv="refresh" content="0; url=frontend/index.html">

  body {
