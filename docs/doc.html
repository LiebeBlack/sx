<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Documentación de Telemetría punto a punto: puesta en marcha, API y configuración del móvil.">
<title>Documentación · Telemetría</title>
<!--
  Lector de la documentación, servido por GitHub Pages desde la carpeta `/docs`.

  Existe porque la portada enlazaba a `SETUP.html`, `API.html` y `CONFIGURACION.html`, y esos ficheros
  **no existen**: la documentación se escribe en Markdown (`SETUP.md`, `API.md`, `CONFIGURACION.md`) y
  nada la convierte. Resultado: la portada se servía bien y cada uno de sus enlaces daba 404.

  La solución no puede ser un conversor ni un paso de compilación —este proyecto no tiene dependencias
  ni herramientas de construcción para el sitio—, así que es la misma idea que `docs/gist.html`:
  **un solo fichero, sin librerías**, que lee el Markdown del mismo sitio (Pages lo publica como
  `text/markdown`) y lo pinta.

  Tres decisiones que no son de adorno:

  - **Lista blanca de ficheros.** El nombre llega por `?f=`; solo se aceptan los tres documentos
    conocidos. Un lector que leyera cualquier ruta sería un buscador de ficheros del sitio.
  - **Todo se escapa antes de pintarse.** Estos documentos traen corchetes angulares literales
    (`<device_id>`, `<hex>`) que, sin escapar, se comerían media página.
  - **Las anclas se generan como las de GitHub.** `CONFIGURACION.md` abre con un índice que enlaza a
    `#6--código-de-seguridad-pin`; si las anclas no coinciden, su propio índice no funciona.
-->
<style>
  :root{
    color-scheme:dark;
    --cyan:#00ffff; --cyan-dim:rgba(0,255,255,.55); --cyan-faint:rgba(0,255,255,.14);
    --purple:#800080; --bg:#000; --panel:#05070a; --line:rgba(128,0,128,.55);
    --warn:#ffcc66; --err:#ff5c8a;
    --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --head:3.6rem;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;background:var(--bg);color:var(--cyan);
    font:14px/1.6 var(--mono);-webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%}
  a{color:var(--cyan);text-decoration:none;border-bottom:1px solid var(--cyan-faint)}
  a:hover{border-bottom-color:var(--cyan)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  header{
    position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
    background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--purple);
  }
  header .brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;
    border:0;color:var(--cyan-dim)}
  header .brand b{color:var(--cyan);font-weight:600}
  header nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
  header nav a{border:1px solid var(--cyan-faint);border-radius:999px;padding:4px 11px;font-size:12px;
    white-space:nowrap}
  header nav a[aria-current="page"]{border-color:var(--cyan);background:rgba(0,255,255,.08)}

  .wrap{max-width:76rem;margin:0 auto;padding:22px 18px 70px;display:grid;gap:26px;
    grid-template-columns:minmax(0,1fr)}
  @media (min-width:1000px){ .wrap{grid-template-columns:minmax(0,1fr) 15rem} }

  aside.toc{order:2}
  @media (min-width:1000px){ aside.toc{order:0;position:sticky;top:var(--head);align-self:start;
    max-height:calc(100vh - var(--head) - 20px);overflow:auto} }
  aside.toc h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-dim);
    margin:0 0 8px;font-weight:600}
  aside.toc a{display:block;padding:3px 0;font-size:12px;color:var(--cyan-dim);border:0}
  aside.toc a:hover{color:var(--cyan)}
  aside.toc a.lvl3{padding-left:12px;font-size:11px}
  @media (max-width:999px){ aside.toc{display:none} }

  article{min-width:0}
  article :is(h1,h2,h3,h4,h5,h6){line-height:1.25;scroll-margin-top:calc(var(--head) + 12px)}
  article h1{font-size:19px;letter-spacing:.02em;margin:0 0 18px;padding-bottom:10px;
    border-bottom:1px solid var(--purple)}
  article h2{font-size:15px;letter-spacing:.04em;margin:34px 0 12px;
    border-bottom:1px solid var(--cyan-faint);padding-bottom:7px}
  article h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan-dim);
    margin:24px 0 8px}
  article h4,article h5,article h6{font-size:12px;color:var(--cyan-dim);margin:18px 0 6px}
  article p{margin:10px 0}
  article ul,article ol{margin:10px 0;padding-left:22px}
  article li{margin:5px 0}
  article li>ul,article li>ol{margin:5px 0}
  article strong{color:#b9ffff;font-weight:600}
  article code{background:rgba(0,255,255,.07);padding:1px 5px;border-radius:3px;
    font:inherit;font-size:12.5px;color:#9ff}
  article pre{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
  article pre code{background:none;padding:0;color:#cfe;font-size:12.5px;line-height:1.55;
    display:block;white-space:pre}
  pre .copy{position:absolute;top:6px;right:6px;font:inherit;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--cyan-dim);background:#000;border:1px solid var(--cyan-faint);
    border-radius:4px;padding:2px 7px;cursor:pointer}
  pre .copy:hover{color:var(--cyan);border-color:var(--cyan)}
  article blockquote{margin:14px 0;padding:2px 0 2px 14px;border-left:2px solid var(--purple);
    color:#8fe8e8}
  article blockquote p{margin:8px 0}
  article hr{border:0;border-top:1px solid var(--purple);margin:26px 0}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0}
  article table{border-collapse:collapse;width:100%;font-size:12.5px}
  article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left;
    vertical-align:top}
  article th{background:rgba(0,255,255,.06);color:var(--cyan);font-weight:600}
  article tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  .box{display:inline-block;width:12px;height:12px;margin-right:7px;border:1px solid var(--cyan-dim);
    border-radius:3px;vertical-align:-1px}
  .box.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

  .menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .menu a{display:block;border:1px solid var(--purple);border-radius:6px;padding:14px 16px;
    background:#000}
  .menu a:hover,.menu a:focus{border-color:var(--cyan)}
  .menu strong{display:block;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
  .menu span{display:block;margin-top:6px;color:var(--cyan-dim);font-size:12px}

  .notice{margin:20px 0;border:1px solid var(--warn);border-radius:6px;padding:12px 14px;
    color:var(--warn);font-size:12.5px}
  .notice.err{border-color:var(--err);color:var(--err)}
  .notice a{color:inherit;border-bottom-color:currentColor}
  footer{margin-top:40px;border-top:1px solid var(--purple);padding-top:12px;color:var(--purple);
    font-size:12px}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation:none!important;transition:none!important}
  }
  @media print{
    header,aside.toc,pre .copy{display:none}
    body,article{color:#000;background:#fff}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><b>Telemetría</b> · documentación</a>
  <nav id="nav" aria-label="Documentos"></nav>
</header>

<div class="wrap">
  <aside class="toc" id="toc" hidden>
    <h2>En esta página</h2>
    <div id="tocLinks"></div>
  </aside>
  <article id="doc" aria-live="polite">
    <p>Cargando la documentación…</p>
  </article>
</div>

<script>
(function () {
  'use strict';

  // Lista blanca: `?f=` llega de la barra de direcciones, así que solo se leen estos tres ficheros.
  var DOCS = {
    'SETUP.md': { titulo: 'Puesta en marcha', resumen: 'Permisos, token, Pages, contenedor y checklist de instalación en el móvil.' },
    'API.md': { titulo: 'API del backend', resumen: 'Ingesta por lotes, lecturas compactas, filtros y borrado por dispositivo.' },
    'CONFIGURACION.md': { titulo: 'Configurar el móvil', resumen: 'Cada clave explicada, la plantilla JSON que la app carga sola y el código de seguridad.' }
  };
  var ORDER = ['SETUP.md', 'API.md', 'CONFIGURACION.md'];

  /* --------------------------------------------------------------- utilidades */

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /**
   * Ancla de un título, con la regla de GitHub: minúsculas; se quitan los caracteres que no son
   * letra, número, espacio o guion (las tildes y la eñe se conservan); y **cada** espacio pasa a ser
   * un guion, sin colapsar. Por eso `## 6 · Código de seguridad (PIN)` da `6--código-de-seguridad-pin`
   * —el `·` deja dos espacios y salen dos guiones—, que es exactamente a lo que apunta el índice de
   * `CONFIGURACION.md`. Si esta regla cambia, el índice del propio documento deja de funcionar.
   */
  function slug(text) {
    var lowered = String(text === null || text === undefined ? '' : text).trim().toLowerCase();
    var out = '';
    for (var i = 0; i < lowered.length; i++) {
      var ch = lowered.charAt(i);
      if (ch === ' ') { out += '-'; continue; }
      if (/[a-z0-9-]/.test(ch)) { out += ch; continue; }
      // Latin-1 (sin × ni ÷) y latino extendido: lo que GitHub conserva en español y lenguas vecinas.
      var code = lowered.charCodeAt(i);
      if ((code >= 0xc0 && code <= 0xff && code !== 0xd7 && code !== 0xf7)
          || (code >= 0x100 && code <= 0x24f)) { out += ch; }
    }
    return out;
  }

  /** Enlace seguro: solo rutas del propio sitio, anclas y los esquemas que estos documentos usan. */
  function safeHref(href) {
    var value = String(href || '').trim();
    if (!value) { return ''; }
    if (value.charAt(0) === '#') { return value; }
    if (/^https?:\/\//i.test(value) || /^mailto:/i.test(value)) { return value; }
    return /^[^:]*$/.test(value) ? value : '';   // ruta relativa, sin esquema
  }

  /**
   * Formato dentro de una línea. El orden importa: se escapa **todo** primero, luego se sacan los
   * tramos de código a un marcador para que la negrita y los enlaces no los toquen, y al final se
   * devuelven. Así un `<device_id>` dentro de un `code` no puede abrir una etiqueta.
   */
  function inline(text) {
    var code = [];
    var html = esc(text).replace(/`([^`]+)`/g, function (all, inner) {
      code.push(inner);
      return '\u0000' + (code.length - 1) + '\u0000';
    });
    html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (all, label, href) {
      var url = safeHref(href);
      if (!url) { return label; }
      var external = /^https?:/i.test(url);
      // `url` ya viene escapado de arriba: volver a escaparlo convertiría `&` en `&amp;amp;`.
      return '<a href="' + url + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + label + '</a>';
    });
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html.replace(/\u0000(\d+)\u0000/g, function (all, index) {
      return '<code>' + code[Number(index)] + '</code>';
    });
  }

  /* --------------------------------------------------------------- lectura del Markdown */

  var FENCE = /^ {0,3}(?:```|~~~)/;
  var HEADING = /^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
  var RULE = /^ {0,3}(?:(?:-{3,})|(?:\*{3,})|(?:_ {0,1}){3,})\s*$/;
  var QUOTE = /^ {0,3}>\s?(.*)$/;
  var ITEM = /^( *)([-*+]|\d+\.)\s+(.*)$/;
  var TABLE_ROW = /^ {0,3}\|/;
  var TABLE_SEP = /^ {0,3}\|? *:?-{2,}:? *(?:\| *:?-{2,}:? *)*\|?\s*$/;

  function isBlockStart(line) {
    return FENCE.test(line) || HEADING.test(line) || RULE.test(line) || QUOTE.test(line)
      || ITEM.test(line) || TABLE_ROW.test(line);
  }

  function cellsOf(row) {
    var line = row.trim();
    if (line.charAt(0) === '|') { line = line.slice(1); }
    if (line.charAt(line.length - 1) === '|') { line = line.slice(0, -1); }
    return line.split('|').map(function (cell) { return cell.trim(); });
  }

  function codeBlock(lines, index) {
    var fence = lines[index].trim().slice(0, 3);
    var language = lines[index].trim().slice(3).trim();
    var body = [];
    index++;
    while (index < lines.length && lines[index].trim().indexOf(fence) !== 0) {
      body.push(lines[index]);
      index++;
    }
    var cls = language ? ' class="language-' + esc(language) + '"' : '';
    return {
      html: '<pre><code' + cls + '>' + esc(body.join('\n')) + '</code></pre>',
      next: index + 1                 // se salta la valla de cierre
    };
  }

  function tableBlock(lines, index) {
    var head = cellsOf(lines[index]);
    var align = cellsOf(lines[index + 1]).map(function (cell) {
      if (/^:-+:$/.test(cell)) { return 'center'; }
      if (/^-+:$/.test(cell)) { return 'right'; }
      if (/^:-+$/.test(cell)) { return 'left'; }
      return '';
    });
    index += 2;
    var rows = [];
    while (index < lines.length && TABLE_ROW.test(lines[index])) {
      rows.push(cellsOf(lines[index]));
      index++;
    }
    var html = '<div class="tablewrap"><table><thead><tr>';
    head.forEach(function (cell, i) {
      html += '<th' + (align[i] ? ' style="text-align:' + align[i] + '"' : '') + '>' + inline(cell) + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr>';
      for (var i = 0; i < head.length; i++) {
        html += '<td' + (align[i] ? ' style="text-align:' + align[i] + '"' : '') + '>'
          + inline(row[i] === undefined ? '' : row[i]) + '</td>';
      }
      html += '</tr>';
    });
    return { html: html + '</tbody></table></div>', next: index };
  }

  function quoteBlock(lines, index) {
    var paragraphs = [], current = [];
    while (index < lines.length && QUOTE.test(lines[index])) {
      var text = lines[index].replace(QUOTE, '$1');
      if (!text.trim()) {
        if (current.length) { paragraphs.push(current.join(' ')); current = []; }
      } else {
        current.push(text.trim());
      }
      index++;
    }
    if (current.length) { paragraphs.push(current.join(' ')); }
    return {
      html: '<blockquote>' + paragraphs.map(function (p) { return '<p>' + inline(p) + '</p>'; }).join('') + '</blockquote>',
      next: index
    };
  }

  /**
   * Listas, con dos cosas que un lector ingenuo hace mal y que sí aparecen en estos documentos:
   * el anidamiento por sangría (`   - **Token name**`) y las **líneas de continuación**, que no
   * empiezan por viñeta pero pertenecen al elemento anterior (`1. Pásalo al teléfono, a la carpeta…`
   * continúa en las dos líneas siguientes, sangradas a tres espacios).
   */
  function listBlock(lines, index) {
    var items = [];
    while (index < lines.length) {
      var match = ITEM.exec(lines[index]);
      if (match) {
        var text = match[3];
        var box = /^\[( |x|X)\]\s+(.*)$/.exec(text);
        var entry = {
          indent: match[1].length,
          ordered: /\d/.test(match[2]),
          text: text,
          box: false,
          checked: false
        };
        if (box) { entry.box = true; entry.checked = box[1].toLowerCase() === 'x'; entry.text = box[2]; }
        items.push(entry);
      } else if (!match && /\S/.test(lines[index]) && !isBlockStart(lines[index]) && items.length) {
        items[items.length - 1].text += ' ' + lines[index].trim();   // continuación del último elemento
      } else {
        break;
      }
      index++;
    }
    return { html: renderItems(items), next: index };
  }

  function renderItems(items) {
    var html = '';
    var stack = [];                                  // niveles abiertos: { indent, tag }
    function open(tag) { stack.push({ indent: items[i].indent, tag: tag }); html += '<' + tag + '>'; }
    var i = 0;
    function close() { var level = stack.pop(); html += '</li></' + level.tag + '>'; }
    for (i = 0; i < items.length; i++) {
      var item = items[i];
      while (stack.length && item.indent < stack[stack.length - 1].indent) { close(); }
      var tag = item.ordered ? 'ol' : 'ul';
      if (!stack.length || item.indent > stack[stack.length - 1].indent
          || stack[stack.length - 1].tag !== tag) {
        if (stack.length && item.indent <= stack[stack.length - 1].indent
            && stack[stack.length - 1].tag !== tag) {
          close();                                   // cambió de numerada a viñeta (o al revés)
        }
        open(tag);
      } else {
        html += '</li>';                             // hermano en el mismo nivel
      }
      html += '<li>' + (item.box ? '<span class="box' + (item.checked ? ' on' : '') + '"></span>' : '')
        + inline(item.text);
    }
    while (stack.length) { close(); }
    return html;
  }

  function paragraphBlock(lines, index) {
    var text = [];
    while (index < lines.length && /\S/.test(lines[index]) && !isBlockStart(lines[index])) {
      text.push(lines[index].trim());
      index++;
    }
    if (!text.length) { text.push(lines[index].trim()); index++; }   // línea que empieza un bloque raro
    return { html: '<p>' + inline(text.join(' ')) + '</p>', next: index };
  }

  function renderMarkdown(markdown) {
    var lines = String(markdown === null || markdown === undefined ? '' : markdown)
      .replace(/\r\n?/g, '\n').replace(/\t/g, '  ').split('\n');
    var out = [];
    var index = 0;
    while (index < lines.length) {
      var line = lines[index];
      var block;
      if (!/\S/.test(line)) { index++; continue; }
      if (FENCE.test(line)) { block = codeBlock(lines, index); }
      else if (HEADING.test(line)) {
        var level = HEADING.exec(line);
        var id = slug(level[2]);
        out.push('<h' + level[1].length + ' id="' + esc(id) + '">' + inline(level[2]) + '</h' + level[1].length + '>');
        index++;
        continue;
      }
      else if (RULE.test(line)) { out.push('<hr>'); index++; continue; }
      else if (QUOTE.test(line)) { block = quoteBlock(lines, index); }
      else if (TABLE_ROW.test(line) && index + 1 < lines.length && TABLE_SEP.test(lines[index + 1])) {
        block = tableBlock(lines, index);
      }
      else if (ITEM.test(line)) { block = listBlock(lines, index); }
      else { block = paragraphBlock(lines, index); }
      out.push(block.html);
      index = block.next;
    }
    return out.join('\n');
  }

  /* --------------------------------------------------------------- montaje de la página */

  var ui = {
    nav: document.getElementById('nav'),
    toc: document.getElementById('toc'),
    tocLinks: document.getElementById('tocLinks'),
    doc: document.getElementById('doc')
  };

  function navHtml(current) {
    return ORDER.map(function (name) {
      return '<a href="doc.html?f=' + encodeURIComponent(name) + '"'
        + (name === current ? ' aria-current="page"' : '') + '>' + esc(DOCS[name].titulo) + '</a>';
    }).join('') + '<a href="index.html">Portada</a>';
  }

  function menuHtml() {
    return '<h1>Documentación</h1><div class="menu">' + ORDER.map(function (name) {
      return '<a href="doc.html?f=' + encodeURIComponent(name) + '"><strong>' + esc(DOCS[name].titulo)
        + '</strong><span>' + esc(DOCS[name].resumen) + '</span></a>';
    }).join('') + '</div>';
  }

  function buildToc(root) {
    var headings = root.querySelectorAll('h2, h3');
    if (headings.length < 3) { ui.toc.hidden = true; return; }
    var html = '';
    for (var i = 0; i < headings.length; i++) {
      var level = headings[i].tagName === 'H3' ? ' class="lvl3"' : '';
      html += '<a href="#' + esc(headings[i].id) + '"' + level + '>' + esc(headings[i].textContent) + '</a>';
    }
    ui.tocLinks.innerHTML = html;
    ui.toc.hidden = false;
  }

  /** Botón «copiar» en cada bloque de código: esta guía es casi toda comandos que se pegan. */
  function addCopyButtons(root) {
    var pres = root.querySelectorAll('pre');
    for (var i = 0; i < pres.length; i++) {
      (function (pre) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy';
        button.textContent = 'copiar';
        button.addEventListener('click', function () {
          var code = pre.querySelector('code');
          copy(code ? code.textContent : pre.textContent, button);
        });
        pre.appendChild(button);
      })(pres[i]);
    }
  }

  function flash(button, text) {
    button.textContent = text;
    setTimeout(function () { button.textContent = 'copiar'; }, 1400);
  }

  function fallbackCopy(text) {
    try {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', 'readonly');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      document.body.appendChild(area);
      area.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(area);
      return ok;
    } catch (error) {
      return false;     // sin permiso de portapapeles: el aviso lo dice, no se finge que copió
    }
  }

  function copy(text, button) {
    var done = function () { flash(button, 'copiado'); };
    var failed = function () { flash(button, 'no se pudo'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {
          if (fallbackCopy(text)) { done(); } else { failed(); }
        });
        return;
      }
    } catch (error) { /* se intenta el respaldo */ }
    if (fallbackCopy(text)) { done(); } else { failed(); }
  }

  function failureNotice(name, error) {
    var detail = (error && error.message) ? error.message : 'error desconocido';
    ui.doc.innerHTML = '<div class="notice err"><b>No se pudo leer <code>' + esc(name) + '</code>.</b><br>'
      + esc(detail) + '<br>El fichero se sirve desde este mismo sitio; si acabas de clonar el '
      + 'repositorio o abriste este HTML desde el disco, el navegador bloquea la lectura. '
      + 'El mismo documento está en <a href="https://github.com/LiebeBlack/sx/blob/main/docs/'
      + encodeURIComponent(name) + '" target="_blank" rel="noopener noreferrer">el repositorio</a>.'
      + '</div>';
  }

  function requestedDoc() {
    var query = String(location.search || '').replace(/^\?/, '');
    var parts = query.split('&');
    for (var i = 0; i < parts.length; i++) {
      var cut = parts[i].indexOf('=');
      var key = cut < 0 ? parts[i] : parts[i].slice(0, cut);
      if (key !== 'f') { continue; }
      var value = cut < 0 ? '' : parts[i].slice(cut + 1);
      try { value = decodeURIComponent(value); } catch (error) { /* se usa tal cual */ }
      value = value.replace(/\\/g, '/').split('/').pop();      // sin rutas: solo el nombre
      return DOCS[value] ? value : '';
    }
    return '';
  }

  function load(name) {
    ui.nav.innerHTML = navHtml(name);
    fetch(name + '?t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (response) {
        if (!response.ok) { throw new Error('HTTP ' + response.status); }
        return response.text();
      })
      .then(function (markdown) {
        if (!markdown || !markdown.trim()) { throw new Error('el documento está vacío'); }
        ui.doc.innerHTML = renderMarkdown(markdown);
        document.title = DOCS[name].titulo + ' · Telemetría';
        addCopyButtons(ui.doc);
        buildToc(ui.doc);
        if (location.hash) {
          // El índice de `CONFIGURACION.md` enlaza a sus propias anclas: al llegar con un `#` en la
          // URL hay que desplazarse a mano, porque el documento aún no existía al cargar la página.
          var target = document.getElementById(location.hash.slice(1));
          if (target) { target.scrollIntoView(); }
        }
      })
      .catch(function (error) { failureNotice(name, error); });
  }

  var name = requestedDoc();
  if (!name) {
    ui.nav.innerHTML = navHtml('');
    ui.doc.innerHTML = menuHtml();
  } else {
    load(name);
  }
})();
</script>
</body>
</html>
